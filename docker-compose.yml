# Reproducible environment for the harness.
#
#   docker compose run --rm harness              # run the CLI in the runtime image
#   docker compose run --rm test                 # run the test suite
#   docker compose --profile ollama up -d ollama # OPTIONAL local Ollama (see below)
#
# Ollama: for real experiment runs on a Mac, use the NATIVE Ollama install (Docker on macOS
# has no GPU access, so a containerised Llama is far slower). The `ollama` service below is
# for Linux or CI machines. By default the harness talks to the host's native Ollama.
# To use the container instead:  OLLAMA_API_BASE=http://ollama:11434 docker compose ...
services:
  harness:
    build:
      context: .
      target: runtime
    image: agent-privilege-drift:dev
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    volumes:
      - ./runs:/app/runs
      - ./configs:/app/configs:ro
      - ./prereg:/app/prereg:ro

  test:
    build:
      context: .
      target: test
    image: agent-privilege-drift:test

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"   # loopback only
    environment:
      OLLAMA_NUM_PARALLEL: "1"    # clean latency numbers (implementation plan §3.3)
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models: {}
