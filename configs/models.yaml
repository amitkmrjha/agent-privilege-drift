# Model registry. One entry per model key; the harness refers to models by key only.
#
# Staged plan (decision D20): the open model (`llama`) runs first; the frontier arm is
# repeated later on the same grid. To switch the frontier model, change ONE line:
# `models.frontier.litellm_model` (and `api_key_env` if the provider changes).

# Shared by every model so both arms see identical decoding settings.
sampling:
  temperature: 0.2
  top_p: 0.9
  max_tokens: 2048

# Per-call timeout in seconds. A hung server fails the call instead of blocking a batch.
request_timeout_s: 300

# What to do when the provider answers 429 (quota hit), for any model (decisions D09, D25).
# The same request is retried in place, so a run is not restarted. The wait before retry n is
# first_wait_s doubled n-1 times up to max_wait_s, then fixed at max_wait_s; each wait is spread by
# +/- jitter so retries do not land together; a wait the provider asks for is a minimum. If the
# provider asks for more than give_up_after_s the quota is treated as exhausted and the batch stops.
# These only change timing, never what the model is asked, so they are safe to tune.
rate_limit_retry:
  attempts: 8
  first_wait_s: 15
  max_wait_s: 120
  jitter: 0.25
  give_up_after_s: 900

models:
  llama:
    litellm_model: ollama/llama3.1:8b-instruct-q4_K_M
    api_base_env: OLLAMA_API_BASE   # falls back to http://localhost:11434
    # Ollama's default context is small and silently truncates long ReAct histories, so it is
    # always set explicitly. Raise it (e.g. 16384) for AgentDojo prompts.
    num_ctx: 8192

  frontier:
    # Provisional until issue #28 picks the frontier model. gemini-2.5-flash returned a 404
    # ("no longer available to new users") on 2026-11-20, and gemini-3.8-flash was overloaded
    # (503 "high demand") the same day, so the small test uses a flash-lite model. Pin an exact
    # id: no "-latest" alias and no "-preview" name, which can change or be retired.
    litellm_model: gemini/gemini-3.5-flash-lite
    api_key_env: GEMINI_API_KEY
    # The API rejects these two ("does not support parameters"), so this arm runs on the
    # provider's default decoding. This differs from the shared `sampling` block above and must
    # be reported as a limitation of the Llama vs frontier comparison.
    omit_params: [temperature, top_p]

  # Amendment exp-v2 (D32), added after the exp-v1 results were seen: a large frontier model, to
  # answer the objection that the small flash-lite model above is not a true frontier baseline.
  # Pinned id, no "-latest" alias and no "-preview" name. Unlike the arm above it accepts the shared
  # decoding settings (temperature 0.2, top-p 0.9), so it runs with the same decoding as Llama.
  frontier_large:
    litellm_model: gemini/gemini-4-carbon
    api_key_env: GEMINI_API_KEY
