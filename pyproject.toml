[project]
name = "privilege-drift"
version = "0.1.0"
description = "Privilege drift of LLM agents under tool-failure pressure: harness, mediators and analysis"
authors = [
    { name = "Amit Kumar" }
]
requires-python = ">=3.12"
dependencies = [
    "agentdojo>=0.1.35",
    "httpx>=0.28.1",
    "litellm>=1.109.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "orjson>=3.13.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "tenacity>=9.2.1",
    "typer>=0.29.1",
]

[project.scripts]
privilege-drift = "privilege_drift:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["shap.*", "scipy.*", "statsmodels.*", "sklearn.*", "agentdojo.*", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = [
    "integration: needs a live local Ollama server (run with -m integration)",
]
